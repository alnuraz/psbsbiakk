<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">






<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheatsheet Dokter Tim — PSBS Biak</title>
<meta name="siteName" content="PSBS Biak Football">
<meta name="siteDescription" content="Panduan klinis dokter tim PSBS Biak: protap, asesmen cedera, rehabilitasi, dan anti-doping.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F7FF;--card:#FFFFFF;--card2:#E0EFFF;--ink:#102D50;--muted:#526E87;--line:#C8DFF3;--brand:#075BBB;--lime:#087AC1;--onlime:#FFFFFF;--gold:#7DD3FC;
 --red:#D32F2F;--redbg:#FDECEA;--amb:#A86400;--ambbg:#FFF3D6;--grn:#2E7D32;--grnbg:#E6F4E7;--blu:#1565C0;--blubg:#E3EFFB;--link:#1565C0;--fig:#FFFFFF;
 color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071C2A;--card:#102B3C;--card2:#17394B;--ink:#EBF6FA;--muted:#A2BFCD;--line:#284959;--red:#FF7B72;--redbg:#3A1E1C;--amb:#FFC14D;--ambbg:#3A2E14;--grn:#7BD389;--grnbg:#17301C;--blu:#8CC4FF;--blubg:#162A40;--link:#8CC4FF;--fig:#F4F6F3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#071C2A;--card:#102B3C;--card2:#17394B;--ink:#EBF6FA;--muted:#A2BFCD;--line:#284959;--red:#FF7B72;--redbg:#3A1E1C;--amb:#FFC14D;--ambbg:#3A2E14;--grn:#7BD389;--grnbg:#17301C;--blu:#8CC4FF;--blubg:#162A40;--link:#8CC4FF;--fig:#F4F6F3;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
a{color:var(--link)}
h1,h2,h3,h4{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
button{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff}
.tr{display:flex;align-items:center;gap:10px;max-width:780px;margin:0 auto;padding:8px 12px}
.tr img{width:36px;height:36px;border-radius:50%;flex:none}
.tr .bt{flex:1;min-width:0;line-height:1.05}
.tr .bt b{display:block;font:800 italic 19px "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .bt b span{color:var(--gold)}
.tr .bt small{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:19px;height:19px}
.stripe{height:4px;background:linear-gradient(90deg,var(--lime) 0 70%,var(--gold) 70% 100%)}
.crumb{max-width:780px;margin:0 auto;padding:6px 12px 8px;display:flex;gap:6px;align-items:center;font-size:13px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.crumb::-webkit-scrollbar{display:none}
.crumb button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}
.crumb span{opacity:.6}
main{max-width:780px;margin:0 auto;padding:14px 14px 60px}
/* home */
.hero{background:var(--brand);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;background-image:radial-gradient(120% 90% at 100% 0%,rgba(56,189,248,.25),transparent 60%)}
.hero h1{font:800 italic clamp(30px,8vw,44px)/1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.hero h1 span{color:var(--gold)}
.hero p{margin:8px 0 0;opacity:.85;font-size:14.5px}
.search{width:100%;font:400 16px "Barlow",sans-serif;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:14px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:16px;padding:12px;cursor:pointer;color:var(--ink);min-height:132px}
.cat .ic{font-size:26px;line-height:1}
.cat b{font:700 19px/1.1 "Barlow Condensed",sans-serif}
.cat span{font-size:12.5px;color:var(--muted);line-height:1.35}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer}
/* lists */
h2.pt{font:800 30px/1.05 "Barlow Condensed",sans-serif;margin:2px 0 4px}
.lead{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--lime));border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer;color:var(--ink)}
.row .tx{flex:1;min-width:0}
.row b{display:block;font-size:16px}
.row small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.row .ar{color:var(--muted);font-size:20px}
.rh{font:700 16px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
/* content */
.jump{position:sticky;top:92px;z-index:3;display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:8px 14px;background:var(--bg);scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:600}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 12px}
.sec>h3{font:700 21px/1.1 "Barlow Condensed",sans-serif;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec>h3 i{font-style:normal;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--card2);font-size:15px;flex:none}
.sec h4{font:700 17px "Barlow Condensed",sans-serif;margin:12px 0 4px}
.sec p{margin:6px 0}
.sec ul,.sec ol{margin:6px 0;padding-left:20px}
.sec li{margin:3px 0}
.pill{display:inline-block;font:700 12px "Barlow",sans-serif;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--muted);margin:0 4px 4px 0;vertical-align:middle}
.pill.red{background:var(--redbg);color:var(--red)}.pill.amb{background:var(--ambbg);color:var(--amb)}.pill.grn{background:var(--grnbg);color:var(--grn)}.pill.blu{background:var(--blubg);color:var(--blu)}
.box{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.box.red{background:var(--redbg)}.box.amb{background:var(--ambbg)}.box.grn{background:var(--grnbg)}.box.blu{background:var(--blubg)}
.box b.h{display:block;font:700 17px "Barlow Condensed",sans-serif;margin-bottom:2px}
.box.red b.h{color:var(--red)}.box.amb b.h{color:var(--amb)}.box.grn b.h{color:var(--grn)}.box.blu b.h{color:var(--blu)}
.box ul{margin:4px 0 0}
.tw{overflow-x:auto;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;background:var(--card2);font-weight:700}
td,th{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.test{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.test b.t{font-size:16px}
.test .pos{background:var(--redbg);border-left:4px solid var(--red);padding:6px 9px;border-radius:6px;margin:6px 0;font-size:14px}
.fig{background:var(--fig);border-radius:10px;padding:6px;margin:8px 0;text-align:center}
.fig img,.fig svg{max-width:100%;height:auto;max-height:260px}
figure.xr{margin:8px 0;background:#0B0F0D;border-radius:12px;padding:8px;color:#E9EEE9}
figure.xr svg{width:100%;height:auto;max-height:300px;display:block}
figure.xr figcaption{font-size:13px;color:#C9D3CC;margin-top:4px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px;cursor:pointer}
.ck:last-child{border-bottom:0}
.ck input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--grn)}
.lnk{display:inline-block;margin:4px 6px 0 0;font-size:13.5px;font-weight:600}
.dest{display:inline-block;font:700 12px "Barlow",sans-serif;padding:3px 8px;border-radius:6px;margin-right:6px}
.dest.igd{background:var(--redbg);color:var(--red)}.dest.ot{background:var(--ambbg);color:var(--amb)}.dest.ko{background:var(--blubg);color:var(--blu)}.dest.fis{background:var(--grnbg);color:var(--grn)}.dest.jp,.dest.lain{background:var(--card2);color:var(--ink)}
.dxh{background:var(--brand);color:#fff;border-radius:18px;padding:16px;margin-bottom:10px}
.dxh h2{font:800 italic clamp(26px,7vw,34px)/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase}
.dxh p{margin:6px 0 0;opacity:.85;font-size:14px}
.dxh .pill{background:rgba(255,255,255,.15);color:#fff}
.dxh .pill.red{background:var(--red);color:#fff}
/* diagrams */
.flow{display:flex;flex-direction:column;gap:22px;margin:8px 0 12px}
.fbox{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lime);border-radius:12px;padding:9px 11px}
.fbox.red{border-left-color:var(--red)}.fbox.amb{border-left-color:var(--amb)}.fbox.blu{border-left-color:var(--blu)}.fbox.grn{border-left-color:var(--grn)}
.fbox:not(:last-child)::after{content:"";position:absolute;left:24px;bottom:-20px;width:2px;height:16px;background:var(--muted)}
.fbox:not(:last-child)::before{content:"";position:absolute;left:20px;bottom:-21px;border:5px solid transparent;border-top:6px solid var(--muted);border-bottom:0}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fn{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 14px "Barlow Condensed",sans-serif;flex:none}
.ft{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--muted);background:var(--card2);padding:2px 8px;border-radius:999px}
.fbox ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.decide{margin-top:8px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.decide .dy,.decide .dn{display:flex;gap:8px;align-items:baseline;margin-top:5px}
.decide span{font-weight:800;font-size:11px;padding:2px 7px;border-radius:6px;flex:none}
.decide .dy span{background:var(--grnbg);color:var(--grn)}.decide .dn span{background:var(--redbg);color:var(--red)}
.banner{border-radius:12px;padding:10px 12px;margin:8px 0 12px;font-size:14.5px;background:var(--card2)}
h3.sub{font:700 18px "Barlow Condensed",sans-serif;margin:14px 0 6px}
table.mini{font-size:14px}
.meta{font-size:13px;color:var(--muted)}
.figsteps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.fstep{margin:0;background:#fff;border-radius:12px;padding:8px;color:#1b231e;border:1px solid var(--line)}
.fstep svg{width:100%;height:auto;display:block}
.fstep figcaption{font-size:13px;line-height:1.35;margin-top:4px}
.fstep figcaption b{display:block;font-size:14px}
.chev{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.chev div{flex:1 1 90px;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.3;color:#fff}
.chev div b{display:block;font-size:14px}
.ladder .rg{display:flex;gap:8px;align-items:stretch;margin:4px 0}
.ladder .rg b{flex:none;width:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 16px "Barlow Condensed",sans-serif}
.ladder .rg span{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;background:var(--card)}
.btn-reset{margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer}
.golink{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;margin:4px 0 8px}
.appcard{display:flex;gap:12px;align-items:center;margin:12px 0 4px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:12px;text-decoration:none;color:var(--ink)}
.appcard b{display:block;font-size:16px}.appcard small{display:block;color:var(--muted);font-size:13px}.appcard .ar{margin-left:auto;color:var(--muted)}
.cats .cat:last-child:nth-child(odd){grid-column:1/-1;min-height:96px}
.foot{font-size:12.5px;color:var(--muted);margin-top:18px}
.nores{color:var(--muted);padding:6px 0}
.hl{background:var(--ambbg);border-radius:3px}
</style>
</head>
<body>
<header class="top">
 <div class="tr"><img src="/assets/logo-psbs-biak-terbaru.png" alt="Logo PSBS Biak"><div class="bt"><b>CHEAT<span>SHEET</span></b><small>Dokter Tim PSBS Biak</small></div>
  <button class="ib" id="menuBtn" aria-label="Menu utama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button><button class="ib" id="homeBtn" aria-label="Beranda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button class="ib" id="themeBtn" aria-label="Ganti tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
 <div class="crumb" id="crumb"></div>
 <div class="stripe" aria-hidden="true"></div>
</header>
<main id="app"></main>
<script>
const LOGO = "/assets/logo-psbs-biak-terbaru.png";
const IMG = {"ankle_drawer": "/club-mark.svg", "apprehension": "/club-mark.svg", "hop": "/club-mark.svg", "lachman": "/club-mark.svg", "lunge": "/club-mark.svg", "mcmurray": "/club-mark.svg", "ottawa": "/club-mark.svg", "squeeze": "/club-mark.svg", "talar_tilt": "/club-mark.svg", "thompson": "/club-mark.svg", "valgus": "/club-mark.svg"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = parent.RansPrefs;
const APP_URL = "EMBED";

const T = { // tests
  gcs:{n:"GCS & pupil",how:"Nilai mata (E), verbal (V), motorik (M). Cek ukuran & refleks pupil kanan-kiri.",pos:"GCS <15, pupil anisokor atau refleks lambat → IGD."},
  cspine:{n:"Pemeriksaan servikal",how:"Tanpa menggerakkan kepala: tanya nyeri leher, palpasi prosesus spinosus garis tengah, cek kekuatan & sensasi 4 ekstremitas. ROM aktif hanya bila tidak ada nyeri garis tengah dan neurologis normal.",pos:"Nyeri garis tengah, defisit neurologis, atau nyeri saat ROM aktif → imobilisasi, IGD."},
  rf_res:{n:"Tahanan & regang rectus femoris",how:"Tengkurap: fleksi lutut pasif (regang), lalu ekstensi lutut melawan tahanan dengan panggul fleksi; palpasi sepanjang paha depan dari SIAI.",pos:"Nyeri/kelemahan atau gap teraba di paha depan; nyeri dekat SIAI → curiga avulsi/cedera tendon sentral.",q:"Rectus Femoris Strain"},
  maddocks:{n:"Pertanyaan Maddocks",how:"“Di stadion mana kita sekarang?”, “Babak berapa sekarang?”, “Siapa yang mencetak gol terakhir di laga ini?”, “Melawan tim apa laga sebelumnya?”, “Apakah tim menang di laga terakhir?”",pos:"Satu saja salah → curiga concussion."},
  scatsym:{n:"Skor gejala SCAT6",how:"22 gejala, masing-masing 0–6. Bandingkan dengan baseline pra-musim.",pos:"Ada gejala baru atau skor naik dari baseline.",link:"https://bjsm.bmj.com/content/bjsports/57/11/622.full.pdf"},
  mbess:{n:"mBESS",how:"Tanpa sepatu, mata tertutup, tangan di pinggang: berdiri dua kaki, satu kaki (kaki non-dominan), dan tandem, masing-masing 20 detik. Hitung error (buka mata, angkat tangan, langkah, dll).",pos:"Error lebih banyak dari baseline."},
  tandem:{n:"Tandem gait",how:"Jalan tumit-ke-jari di garis 3 m, putar, kembali. 4 kali, catat waktu terbaik.",pos:"Lebih lambat dari baseline atau gagal (keluar garis)."},
  voms:{n:"VOMS (vestibulo-okular)",how:"Smooth pursuit, saccade horizontal & vertikal, konvergensi, VOR, visual motion sensitivity. Tanyakan gejala setelah tiap tahap.",pos:"Provokasi gejala ≥2 poin atau jarak konvergensi >5 cm."},
  nasal:{n:"Inspeksi hidung & septum",how:"Inspeksi deformitas, palpasi tulang hidung, lihat septum dengan senter.",pos:"Benjolan kebiruan di septum = hematoma septum → drainase hari ini."},
  sh_inspect:{n:"Inspeksi kontur bahu",how:"Bandingkan kedua bahu dari depan & samping, pasien duduk tegak.",pos:"Bahu “squared-off”/akromion menonjol = dislokasi; step deformity di AC = cedera AC."},
  sh_axil:{n:"Neurovaskular (n. aksilaris)",how:"Sensasi kulit lateral deltoid (regimental badge), kontraksi deltoid, nadi radial. Ulangi setelah reposisi.",pos:"Baal/lemah deltoid atau nadi lemah → catat, rujuk segera."},
  apprehension:{n:"Apprehension & relocation",img:"apprehension",how:"Telentang, bahu abduksi 90°, eksorotasi perlahan. Relocation: tekan humerus ke posterior.",pos:"Pasien takut/“mau lepas” dan rasa itu hilang saat relocation.",q:"Apprehension Test"},
  crossbody:{n:"Cross-body adduction",how:"Fleksi bahu 90°, tarik lengan melintasi dada.",pos:"Nyeri terlokalisasi di sendi AC.",q:"Cross Body Adduction Test"},
  ac_palp:{n:"Palpasi AC & klavikula",how:"Palpasi sepanjang klavikula sampai sendi AC, bandingkan sisi sehat.",pos:"Nyeri tekan fokal, krepitasi, atau benjolan/step → X-ray."},
  emptycan:{n:"Empty can (supraspinatus)",how:"Abduksi 90° di bidang skapula, ibu jari ke bawah, tahan dorongan ke bawah.",pos:"Nyeri atau lemah dibanding sisi sehat.",q:"Empty Can Test"},
  er_resist:{n:"Resisted external rotation",how:"Siku 90° di samping badan, tahan dorongan rotasi interna.",pos:"Lemah/nyeri → infraspinatus; lag sign = robekan."},
  painful_arc:{n:"Painful arc",how:"Abduksi aktif penuh perlahan.",pos:"Nyeri di 60–120° = subakromial; >120° = AC.",q:"Painful Arc"},
  dip_ext:{n:"Ekstensi aktif DIP",how:"Tahan PIP lurus, minta pasien meluruskan ujung jari.",pos:"Tidak bisa meluruskan DIP = mallet finger."},
  fdp:{n:"Tes FDP",how:"Tahan PIP & MCP lurus, minta pasien menekuk ujung jari.",pos:"Tidak bisa fleksi DIP = jersey finger (avulsi FDP), sering jari manis."},
  pip_stress:{n:"Stres kolateral PIP",how:"Stres varus & valgus PIP pada ekstensi penuh dan fleksi 30°; minta fleksi-ekstensi aktif penuh.",pos:"Laxity >20° atau tidak stabil saat gerak aktif → X-ray, rujuk."},
  ucl_thumb:{n:"Stres UCL ibu jari",how:"Stres valgus MCP-1 pada ekstensi dan fleksi 30°.",pos:"Laxity >30–35° atau beda >15° dari sisi sehat, end-point lunak = ruptur komplit.",q:"Gamekeeper Thumb"},
  snuff:{n:"Snuffbox, tuberkel scaphoid & kompresi",how:"Palpasi anatomical snuffbox, tuberkel scaphoid di volar; kompresi aksial ibu jari.",pos:"Nyeri di salah satu = curiga fraktur scaphoid walau X-ray awal normal."},
  rotcheck:{n:"Rotasi jari & palpasi metakarpal",how:"Minta mengepal: semua jari harus menunjuk ke tuberkel scaphoid. Palpasi tiap metakarpal.",pos:"Jari bersilang (scissoring) = malrotasi → Sp.OT."},
  neuro_l:{n:"Neurologis L4–S1",how:"Miotom (dorsofleksi ankle L4, ibu jari L5, plantarfleksi S1), dermatom, refleks patela & Achilles.",pos:"Defisit miotom/dermatom/refleks sesuai radiks."},

const GDX = {"p_ankle": {"n": "Protap ankle sprain", "d": "Di lapangan → 72 jam → rehab → kembali main, dengan gambar", "h": "\n  <div class=\"flow\"><div class=\"fbox red\"><div class=\"fh\"><span class=\"fn\">1</span><b>Di lapangan</b><span class=\"ft\">0–15 menit</span></div><ul><li>Tanya mekanisme (inversi? rotasi eksternal?), bunyi pop, bisa menumpu?</li><li>Cek <b>Ottawa</b>: nyeri tulang maleolus, basis MT V, navikular, tidak bisa menumpu 4 langkah → keluar, X-ray</li><li>Cek deformitas & neurovaskular distal</li><li>Cooling spray/es <b>hanya</b> untuk analgesia sesaat — bukan alasan memaksakan main</li></ul><div class=\"fgo\"><div class=\"decide\"><b>Bisa jalan tanpa pincang, hop satu kaki &amp; cutting tanpa nyeri berarti?</b><div class=\"dy\"><span>Ya</span>Taping/brace → boleh lanjut, pantau tiap time-out</div><div class=\"dn\"><span>Tidak</span>Keluar dari laga → lanjut langkah 2</div></div></div></div><div class=\"fbox amb\"><div class=\"fh\"><span class=\"fn\">2</span><b>Fase akut: PEACE</b><span class=\"ft\">0–72 jam</span></div><ul><li><b>P</b>rotect: brace semi-rigid/tape, kruk bila pincang</li><li><b>E</b>levate: di atas jantung sesering mungkin</li><li><b>A</b>void: NSAID 48–72 jam pertama &amp; es berlebihan (es 10–15 menit boleh untuk nyeri)</li><li><b>C</b>ompress: bandage elastis figure-8 / tubigrip + horseshoe pad</li><li><b>E</b>ducate: menumpu sesuai toleransi sejak dini; hindari HARM (heat, alcohol, running, massage)</li></ul></div><div class=\"fbox blu\"><div class=\"fh\"><span class=\"fn\">3</span><b>Fase LOVE</b><span class=\"ft\">Hari 3–14</span></div><ul><li><b>L</b>oad: jalan normal, alfabet kaki, calf stretch (lunge)</li><li>Isometrik eversi → band peroneal</li><li>Balance satu kaki mata terbuka → tertutup → permukaan labil</li><li><b>O</b>ptimism &amp; <b>V</b>ascularisation: sepeda statis bebas nyeri</li><li><b>E</b>xercise: heel raise dua kaki → satu kaki</li></ul></div><div class=\"fbox grn\"><div class=\"fh\"><span class=\"fn\">4</span><b>Kembali ke sepak bola</b><span class=\"ft\">Minggu 2–6</span></div><ul><li>Jogging → sprint → hop → lateral shuffle → ubah arah → drill sepak bola</li><li>Kriteria: lunge &amp; Y-balance simetris, single hop LSI ≥90%, cutting tanpa nyeri</li><li>Brace/taping saat main <b>6–12 bulan</b> + latihan balance mengurangi kambuh</li></ul></div></div>\n  <div class=\"banner info\">Rujuk bila: Ottawa positif, curiga high ankle sprain (squeeze/ER test +), tidak bisa menumpu &gt;3–5 hari, instabilitas berulang, atau tidak membaik setelah 4–6 minggu.</div>\n  <h3 class=\"sub\">Bandage kompresi figure-8</h3>\n  <figure class=\"fstep\" style=\"max-width:280px\"><svg viewBox=\"0 0 220 170\" role=\"img\" aria-label=\"Mulai dari pangkal jari, menyilang membentuk angka 8 di ankle, tumpang ½, lebih kencang di distal. Cek warna &amp;amp; sensasi jari.\"><path d=\"M78,0 L80,92 Q72,110 64,124 Q58,142 70,155 L172,158 Q206,160 208,150 Q206,138 182,132 L138,113 Q121,105 118,90 L115,0 Z\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><circle cx=\"99\" cy=\"99\" r=\"7\" fill=\"#EBBE9E\" stroke=\"#8A5A3C\" stroke-width=\"1.5\"/><circle cx=\"152\" cy=\"146\" r=\"3\" fill=\"#8A5A3C\"/><path d=\"M196,140 L196,158\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M180,133 L176,158\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M162,125 L156,158\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M144,118 L138,157\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M124,100 L86,150\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M84,100 L120,140\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M80,82 L118,90\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M79,68 L117,76\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M78,54 L116,62\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption>Mulai dari pangkal jari, menyilang membentuk angka 8 di ankle, tumpang ½, lebih kencang di distal. Cek warna &amp; sensasi jari.</figcaption></figure>\n  "}, "p_knee": {"n": "Protap cedera lutut akut", "d": "Curiga ACL, MCL, meniskus, dislokasi patela", "h": "\n  <div class=\"flow\"><div class=\"fbox red\"><div class=\"fh\"><span class=\"fn\">1</span><b>Di lapangan</b><span class=\"ft\">0–15 menit</span></div><ul><li>Mekanisme: pivot/landing non-kontak (ACL), pukulan dari luar (MCL), twisting (meniskus), patela bergeser</li><li><b>Lachman sedini mungkin</b> — sebelum bengkak &amp; spasme</li><li>Deformitas + kaki dingin/baal → curiga dislokasi lutut → IGD</li></ul><div class=\"fgo\"><div class=\"decide\"><b>Pop + bengkak cepat (&lt;2 jam), giving way, atau tidak bisa menumpu?</b><div class=\"dy\"><span>Ya</span>Keluar, jangan kembali hari itu</div><div class=\"dn\"><span>Tidak</span>Tes fungsional (hop, cutting) sebelum boleh lanjut</div></div></div></div><div class=\"fbox amb\"><div class=\"fh\"><span class=\"fn\">2</span><b>0–72 jam</b></div><ul><li>PEACE, kruk sesuai toleransi</li><li>Pertahankan <b>ekstensi penuh</b> (bantal di bawah tumit, bukan di bawah lutut)</li><li>Quad set &amp; straight leg raise</li><li>Locked knee → jangan dipaksa, Sp.OT 24–72 jam</li></ul></div><div class=\"fbox blu\"><div class=\"fh\"><span class=\"fn\">3</span><b>Diagnosis & rujukan</b><span class=\"ft\">≤1 minggu</span></div><ul><li>X-ray bila Ottawa knee positif</li><li>MRI + Sp.OT ≤1 minggu untuk curiga ACL/meniskus/MCL grade III</li><li>MCL grade I–II: brace berengsel + fisio</li></ul></div><div class=\"fbox grn\"><div class=\"fh\"><span class=\"fn\">4</span><b>Rehabilitasi</b></div><ul><li>Hilangkan efusi, ROM penuh, aktivasi quadriceps</li><li>Kriteria RTS ACL: ≥9 bulan, LSI quadriceps &amp; hop ≥90%, kesiapan psikologis</li></ul></div></div>"}, "p_ham": {"n": "Protap hamstring strain", "d": "Sprint, rasa ditarik di belakang paha", "h": "\n  <div class=\"flow\"><div class=\"fbox red\"><div class=\"fh\"><span class=\"fn\">1</span><b>Di lapangan</b></div><ul><li>Hentikan bermain — hamstring strain tidak kembali di hari yang sama</li><li>Palpasi: jarak dari tuberositas iskium, gap teraba, memar luas → curiga avulsi proksimal (Sp.OT ≤1 minggu)</li><li>Jangan stretching agresif</li></ul></div><div class=\"fbox amb\"><div class=\"fh\"><span class=\"fn\">2</span><b>Hari 0–5</b></div><ul><li>PEACE, kompresi</li><li>Jalan normal sesegera mungkin (kruk singkat bila pincang)</li><li>Isometrik fleksi lutut bebas nyeri di beberapa sudut</li></ul></div><div class=\"fbox blu\"><div class=\"fh\"><span class=\"fn\">3</span><b>Penguatan</b><span class=\"ft\">Minggu 1–3</span></div><ul><li>Bridge → single-leg bridge → RDL</li><li>Eksentrik: Nordic, sliders</li><li>Running progression 60% → 80% → 90% → sprint maksimal</li></ul></div><div class=\"fbox grn\"><div class=\"fh\"><span class=\"fn\">4</span><b>Kembali main</b></div><ul><li>Sprint maksimal tanpa nyeri, kekuatan eksentrik ≥90%, Askling H-test negatif</li><li>Nordic diteruskan — risiko kambuh tertinggi dalam 2 bulan pertama</li></ul></div></div>"}, "p_quad": {"n": "Protap kontusio paha", "d": "Lutut lawan menghantam paha (dead leg)", "h": "\n  <div class=\"flow\"><div class=\"fbox red\"><div class=\"fh\"><span class=\"fn\">1</span><b>Segera</b><span class=\"ft\">0–10 menit</span></div><ul><li><b>Lutut fleksi ±120°</b> dengan bandage — pertahankan 24 jam</li><li>Es 10–15 menit untuk nyeri</li><li>Waspada sindrom kompartemen: paha sangat tegang, nyeri tak sebanding → IGD</li></ul></div><div class=\"fbox amb\"><div class=\"fh\"><span class=\"fn\">2</span><b>24 jam</b></div><ul><li>Nilai fleksi lutut tengkurap: &gt;90° ringan, 45–90° sedang, &lt;45° berat</li><li><b>Hindari HARM</b>: panas, alkohol, lari, masase (risiko miositis osifikans)</li></ul></div><div class=\"fbox grn\"><div class=\"fh\"><span class=\"fn\">3</span><b>Pemulihan</b></div><ul><li>ROM aktif bebas nyeri, penguatan bertahap</li><li>Kembali main: fleksi setara sisi sehat, sprint &amp; lompat tanpa nyeri, pelindung paha bila perlu</li></ul></div></div>"}, "p_finger": {"n": "Protap cedera jari", "d": "Jammed finger, dislokasi PIP, mallet, jersey finger", "h": "\n  <div class=\"flow\"><div class=\"fbox red\"><div class=\"fh\"><span class=\"fn\">1</span><b>Di lapangan</b></div><ul><li>Inspeksi deformitas, rotasi (minta mengepal — jari bersilang?)</li><li>Dislokasi PIP dorsal tanpa curiga fraktur: traksi ringan → reduksi, cek gerak aktif penuh</li><li>Tes ekstensi DIP (mallet) &amp; fleksi DIP (jersey finger)</li></ul><div class=\"fgo\"><div class=\"decide\"><b>Stabil, gerak aktif penuh, bisa menangkap bola?</b><div class=\"dy\"><span>Ya</span>Buddy taping → lanjut main</div><div class=\"dn\"><span>Tidak</span>Keluar, X-ray</div></div></div></div><div class=\"fbox amb\"><div class=\"fh\"><span class=\"fn\">2</span><b>Setelah laga</b></div><ul><li>X-ray semua dislokasi &amp; deformitas</li><li>Mallet: splint ekstensi DIP terus-menerus 6–8 minggu</li><li>Jersey finger: Sp.OT ≤7–10 hari (butuh operasi)</li></ul></div><div class=\"fbox grn\"><div class=\"fh\"><span class=\"fn\">3</span><b>Bermain dengan proteksi</b></div><ul><li>Buddy taping atau splint lunak — <b>splint keras umumnya tidak diizinkan wasit (Law 4)</b></li></ul></div></div>\n  <figure class=\"fstep\" style=\"max-width:280px\"><svg viewBox=\"0 0 160 170\" role=\"img\" aria-label=\"Buddy taping: dua strip di ruas proksimal &amp;amp; tengah, hindari tepat di atas sendi agar tetap bisa menekuk.\"><g transform=\"translate(20,10)\"><rect x=\"40\" y=\"20\" width=\"26\" height=\"130\" rx=\"13\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><rect x=\"72\" y=\"10\" width=\"26\" height=\"140\" rx=\"13\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><line x1=\"40\" y1=\"62\" x2=\"98\" y2=\"62\" stroke=\"#8A5A3C\" stroke-width=\"1\"/><line x1=\"40\" y1=\"100\" x2=\"98\" y2=\"100\" stroke=\"#8A5A3C\" stroke-width=\"1\"/></g><path d=\"M56,58 L122,58\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M56,96 L122,96\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption>Buddy taping: dua strip di ruas proksimal &amp; tengah, hindari tepat di atas sendi agar tetap bisa menekuk.</figcaption></figure>"}, "p_shoulder": {"n": "Protap dislokasi bahu", "d": "Bahu “keluar” saat duel/kiper jatuh", "h": "\n  <div class=\"flow\"><div class=\"fbox red\"><div class=\"fh\"><span class=\"fn\">1</span><b>Di lapangan</b></div><ul><li>Cek <b>n. aksilaris</b> (sensasi lateral deltoid) &amp; nadi radial</li><li>Reduksi hanya oleh dokter terlatih, dislokasi berulang tanpa curiga fraktur</li><li>Dislokasi pertama / curiga fraktur / ragu → sling, IGD untuk X-ray</li></ul></div><div class=\"fbox amb\"><div class=\"fh\"><span class=\"fn\">2</span><b>Setelah reduksi</b></div><ul><li>Ulang pemeriksaan neurovaskular</li><li>X-ray pasca reduksi</li><li>Sling 1–2 minggu untuk kenyamanan</li></ul></div><div class=\"fbox grn\"><div class=\"fh\"><span class=\"fn\">3</span><b>Rujuk & rehab</b></div><ul><li>Dislokasi pertama atlet muda → Sp.OT ≤1 minggu (MRI)</li><li>Rotator cuff &amp; stabilisator skapula, propriosepsi</li><li>Kembali main: ROM &amp; kekuatan setara, apprehension negatif</li></ul></div></div>"}, "p_cramp": {"n": "Protap kram otot", "d": "Kram saat latihan/laga (EAMC)", "h": "\n  <div class=\"flow\"><div class=\"fbox red\"><div class=\"fh\"><span class=\"fn\">1</span><b>Saat kram</b></div><ul><li>Hentikan aktivitas, <b>regang pasif</b> otot yang kram (betis: dorsofleksi ankle; hamstring: ekstensi lutut) sampai lepas</li><li>Kontraksi ringan otot antagonis membantu</li></ul></div><div class=\"fbox amb\"><div class=\"fh\"><span class=\"fn\">2</span><b>Singkirkan yang serius</b></div><ul><li>Kram luas/berulang + bingung, suhu tinggi → <b>heat illness</b></li><li>Minum air berlebihan + mual, bingung → hiponatremia</li><li>Nyeri otot hebat + urin gelap → rhabdomyolisis</li><li>Kram satu otot + nyeri tajam setelah sprint → curiga strain</li></ul></div><div class=\"fbox grn\"><div class=\"fh\"><span class=\"fn\">3</span><b>Kembali & cegah</b></div><ul><li>Boleh kembali bila tanpa nyeri, kekuatan normal</li><li>Cairan + natrium bila keringat banyak</li><li>Kondisi fisik &amp; manajemen kelelahan; regangan rutin otot yang sering kram</li></ul></div></div>"}, "t_acute": {"n": "PRICE, POLICE, PEACE & LOVE", "d": "Penanganan awal jaringan lunak, es, cooling spray, HARM", "h": "\n  <div style=\"overflow-x:auto\"><table class=\"mini\"><thead><tr><th>Akronim</th><th>Isi</th><th>Catatan</th></tr></thead><tbody><tr><td>PRICE</td><td>Protection, Rest, Ice, Compression, Elevation</td><td>Klasik; “rest” total kini tidak dianjurkan lama</td></tr><tr><td>POLICE</td><td>Protection, <b>Optimal Loading</b>, Ice, Compression, Elevation</td><td>Beban dini terkontrol menggantikan istirahat</td></tr><tr><td>PEACE &amp; LOVE</td><td>Protect, Elevate, Avoid anti-inflamasi, Compress, Educate → Load, Optimism, Vascularisation, Exercise</td><td>Terbaru; mencakup fase lanjut &amp; edukasi</td></tr><tr><td>HARM (hindari)</td><td>Heat, Alcohol, Re-injury/Running, Massage</td><td>Dalam 48–72 jam pertama</td></tr></tbody></table></div>\n  <h3 class=\"sub\">Es (krioterapi)</h3><ul><li>Tujuan utama: <b>mengurangi nyeri</b>, bukan “menghentikan peradangan”</li><li>Es dalam kantong + handuk basah tipis, <b>10–20 menit</b>, ulang tiap 2–3 jam bila perlu</li><li>Maks. 10 menit di area saraf superfisial (kaput fibula, siku medial)</li><li>Hindari pada Raynaud, urtikaria dingin, gangguan sensasi</li></ul>\n  <h3 class=\"sub\">Cooling spray (vapocoolant)</h3><ul><li>Efek: analgesia permukaan sesaat (detik–menit), tidak mendinginkan jaringan dalam</li><li>Cara: kocok, jarak ±15–20 cm, semprot menyapu 3–5 detik, berhenti sebelum kulit memutih/beku; maks. 2–3 kali</li><li>Jangan pada luka terbuka, mata, mukosa, wajah dekat hidung</li><li>Beberapa produk mudah terbakar — jauhkan dari api</li><li><b>Jangan dipakai untuk menutupi cedera serius</b>: curiga fraktur, dislokasi, concussion tetap keluar</li></ul>\n  <h3 class=\"sub\">Kompresi</h3><ul><li>Bandage elastis dari distal ke proksimal, tumpang ½, lebih kencang di distal</li><li>Horseshoe pad di sekitar maleolus membantu mengurangi edema</li><li>Longgarkan bila jari dingin, pucat, kesemutan</li></ul>\n  <p class=\"meta\"><a href=\"https://bjsm.bmj.com/content/54/2/72\" target=\"_blank\" rel=\"noopener\">Dubois &amp; Esculier, BJSM 2020</a> • <a href=\"https://bjsm.bmj.com/content/46/4/220\" target=\"_blank\" rel=\"noopener\">Bleakley dkk., POLICE, BJSM 2012</a></p>"}, "t_kinesio": {"n": "Kinesio taping", "d": "Prinsip, ankle, edema (fan), lutut/patela", "h": "\n  <div class=\"banner info\">Bukti ilmiah kinesio taping terbatas: mungkin membantu nyeri jangka pendek &amp; rasa percaya diri. Untuk <b>stabilitas ankle, pakai tape rigid atau brace</b>.</div>\n  <h3 class=\"sub\">Prinsip</h3><ul><li>Kulit bersih, kering, tanpa lotion; cukur bila perlu</li><li>Bulatkan sudut tape agar tidak mudah lepas</li><li>Robek kertas di tengah, <b>anchor 0% tarikan</b> 3–5 cm di tiap ujung</li><li>Tarikan di bagian tengah: 15–25% (ringan), 50% (sedang), 75% (kuat)</li><li>Gosok 10–20 detik untuk mengaktifkan lem; pasang 30–60 menit sebelum aktivitas</li><li>Tahan 3–5 hari; lepas searah tumbuh rambut sambil menekan kulit</li><li>Uji kulit dulu pada pemain dengan kulit sensitif</li></ul>\n  <h3 class=\"sub\">Ankle (stabilitas lateral)</h3><div class=\"figsteps\"><figure class=\"fstep\"><svg viewBox=\"0 0 220 170\" role=\"img\" aria-label=\"Langkah 1: Stirrup kinesio\"><path d=\"M78,0 L80,92 Q72,110 64,124 Q58,142 70,155 L172,158 Q206,160 208,150 Q206,138 182,132 L138,113 Q121,105 118,90 L115,0 Z\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><circle cx=\"99\" cy=\"99\" r=\"7\" fill=\"#EBBE9E\" stroke=\"#8A5A3C\" stroke-width=\"1.5\"/><circle cx=\"152\" cy=\"146\" r=\"3\" fill=\"#8A5A3C\"/><path d=\"M95,18 Q92,124 82,157\" fill=\"none\" stroke=\"#D7263D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption><b>1. Stirrup kinesio</b>Ankle 90°. Anchor 0% di medial betis bawah, tarik 50% saat melewati bawah tumit, ujung 0% di lateral betis.</figcaption></figure><figure class=\"fstep\"><svg viewBox=\"0 0 220 170\" role=\"img\" aria-label=\"Langkah 2: Strip ATFL\"><path d=\"M78,0 L80,92 Q72,110 64,124 Q58,142 70,155 L172,158 Q206,160 208,150 Q206,138 182,132 L138,113 Q121,105 118,90 L115,0 Z\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><circle cx=\"99\" cy=\"99\" r=\"7\" fill=\"#EBBE9E\" stroke=\"#8A5A3C\" stroke-width=\"1.5\"/><circle cx=\"152\" cy=\"146\" r=\"3\" fill=\"#8A5A3C\"/><path d=\"M95,18 Q92,124 82,157\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M152,140 Q126,114 113,70\" fill=\"none\" stroke=\"#D7263D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption><b>2. Strip ATFL</b>Kaki plantarfleksi-inversi ringan. Anchor 0% di lateral kaki dekat basis MT V, tarik 50% melewati depan maleolus lateral, ujung 0% di tibia anterior.</figcaption></figure><figure class=\"fstep\"><svg viewBox=\"0 0 220 170\" role=\"img\" aria-label=\"Langkah 3: Penguat (opsional)\"><path d=\"M78,0 L80,92 Q72,110 64,124 Q58,142 70,155 L172,158 Q206,160 208,150 Q206,138 182,132 L138,113 Q121,105 118,90 L115,0 Z\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><circle cx=\"99\" cy=\"99\" r=\"7\" fill=\"#EBBE9E\" stroke=\"#8A5A3C\" stroke-width=\"1.5\"/><circle cx=\"152\" cy=\"146\" r=\"3\" fill=\"#8A5A3C\"/><path d=\"M95,18 Q92,124 82,157\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M152,140 Q126,114 113,70\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M104,22 Q100,124 90,158\" fill=\"none\" stroke=\"#D7263D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption><b>3. Penguat (opsional)</b>Strip kedua sejajar stirrup, tumpang ½, untuk rasa stabil. Gosok 10–20 detik agar lem aktif.</figcaption></figure></div>\n  <h3 class=\"sub\">Edema (fan/lymphatic)</h3>\n  <figure class=\"fstep\" style=\"max-width:280px\"><svg viewBox=\"0 0 220 170\" role=\"img\" aria-label=\"Fan 4 ekor: anchor 0% di proksimal (ke arah aliran limfe), ekor menyebar di area bengkak dengan tarikan 0–20%. Dua fan bisa disilangkan.\"><path d=\"M78,0 L80,92 Q72,110 64,124 Q58,142 70,155 L172,158 Q206,160 208,150 Q206,138 182,132 L138,113 Q121,105 118,90 L115,0 Z\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><circle cx=\"99\" cy=\"99\" r=\"7\" fill=\"#EBBE9E\" stroke=\"#8A5A3C\" stroke-width=\"1.5\"/><circle cx=\"152\" cy=\"146\" r=\"3\" fill=\"#8A5A3C\"/><path d=\"M80,48 L84,58\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M84,58 Q86,100 92,148\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M84,58 Q96,100 112,142\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M84,58 Q108,96 130,130\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M84,58 Q118,90 146,122\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption>Fan 4 ekor: anchor 0% di proksimal (ke arah aliran limfe), ekor menyebar di area bengkak dengan tarikan 0–20%. Dua fan bisa disilangkan.</figcaption></figure>\n  <h3 class=\"sub\">Lutut (patela)</h3><div class=\"figsteps\"><figure class=\"fstep\"><svg viewBox=\"0 0 160 220\" role=\"img\" aria-label=\"Langkah 1: Y-strip patela\"><path d=\"M42,0 L118,0 Q114,80 112,100 Q116,120 108,140 L100,220 L60,220 L52,140 Q44,120 48,100 Q46,80 42,0 Z\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><ellipse cx=\"80\" cy=\"104\" rx=\"16\" ry=\"20\" fill=\"#EBBE9E\" stroke=\"#8A5A3C\" stroke-width=\"1.5\"/><circle cx=\"80\" cy=\"142\" r=\"3\" fill=\"#8A5A3C\"/><path d=\"M80,170 L80,140\" fill=\"none\" stroke=\"#D7263D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M80,140 Q58,128 59,104 Q60,82 72,70\" fill=\"none\" stroke=\"#D7263D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M80,140 Q102,128 101,104 Q100,82 88,70\" fill=\"none\" stroke=\"#D7263D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption><b>1. Y-strip patela</b>Lutut fleksi 60–90°. Anchor 0% di bawah tuberositas tibia, ekor mengelilingi tepi patela dengan 25–50%, ujung 0% di atas patela.</figcaption></figure><figure class=\"fstep\"><svg viewBox=\"0 0 160 220\" role=\"img\" aria-label=\"Langkah 2: I-strip tendon (opsional)\"><path d=\"M42,0 L118,0 Q114,80 112,100 Q116,120 108,140 L100,220 L60,220 L52,140 Q44,120 48,100 Q46,80 42,0 Z\" fill=\"#F3CFB3\" stroke=\"#8A5A3C\" stroke-width=\"2\"/><ellipse cx=\"80\" cy=\"104\" rx=\"16\" ry=\"20\" fill=\"#EBBE9E\" stroke=\"#8A5A3C\" stroke-width=\"1.5\"/><circle cx=\"80\" cy=\"142\" r=\"3\" fill=\"#8A5A3C\"/><path d=\"M80,170 L80,140\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M80,140 Q58,128 59,104 Q60,82 72,70\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M80,140 Q102,128 101,104 Q100,82 88,70\" fill=\"none\" stroke=\"#3E7CB1\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/><path d=\"M56,128 L104,128\" fill=\"none\" stroke=\"#D7263D\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\".9\"/></svg><figcaption><b>2. I-strip tendon (opsional)</b>Untuk patellar tendinopathy: strip melintang di tendon patela, tarik 50% di tengah, ujung 0%.</figcaption></figure></div>"}, "t_massage": {"n": "Massage & foam rolling", "d": "Pre-game, pasca laga, kontraindikasi", "h": "\n  <div style=\"overflow-x:auto\"><table class=\"mini\"><thead><tr><th>Waktu</th><th>Teknik</th><th>Durasi</th></tr></thead><tbody><tr><td>Pre-game</td><td>Ritme cepat &amp; ringan: effleurage → petrissage → tapotement ringan; hindari tekanan dalam</td><td>5–10 menit, diikuti pemanasan aktif</td></tr><tr><td>Pasca laga</td><td>Ritme lambat: effleurage &amp; petrissage otot besar (betis, quadriceps, hamstring, gluteus)</td><td>15–20 menit; membantu persepsi pemulihan &amp; DOMS</td></tr><tr><td>Foam rolling</td><td>Tekanan sedang, gulir pelan</td><td>30–60 detik per otot, 1–3 set; meningkatkan ROM sementara tanpa menurunkan kekuatan</td></tr></tbody></table></div>\n  <h3 class=\"sub\">Jangan masase bila</h3><ul><li>Cedera akut &lt;48–72 jam di area tersebut (HARM)</li><li>Kontusio otot — risiko miositis osifikans</li><li>Curiga DVT: betis bengkak, hangat, nyeri, terutama setelah penerbangan jauh</li><li>Fraktur, luka terbuka, infeksi kulit, demam</li></ul>"}, "t_activation": {"n": "Aktivasi otot & pemanasan", "d": "Rutinitas 10–12 menit sebelum latihan/laga", "h": "\n  <p>Lakukan setelah pemanasan umum ringan (jogging/skipping 3–5 menit). Total ±10–12 menit, lalu pemanasan sepak bola spesifik.</p>\n  <div style=\"overflow-x:auto\"><table class=\"mini\"><thead><tr><th>Latihan</th><th>Dosis</th><th>Target &amp; cue</th></tr></thead><tbody><tr><td>Glute bridge</td><td>2×10, tahan 2 dtk</td><td>Gluteus; panggul lurus, jangan melengkung punggung</td></tr><tr><td>Lateral band walk / monster walk</td><td>2×10 langkah tiap arah</td><td>Gluteus medius; lutut tidak jatuh ke dalam</td></tr><tr><td>Clamshell / side plank + abduksi</td><td>2×10 / 2×20 dtk</td><td>Kontrol panggul &amp; lutut saat landing</td></tr><tr><td>Single-leg RDL (berat badan)</td><td>2×6 per kaki</td><td>Hamstring &amp; keseimbangan; punggung netral</td></tr><tr><td>Heel raise + tibialis raise</td><td>2×12</td><td>Betis &amp; tibialis anterior</td></tr><tr><td>Single-leg balance + lempar bola</td><td>2×30 dtk per kaki</td><td>Propriosepsi ankle</td></tr><tr><td>Pogo hop → lateral hop</td><td>2×10</td><td>Kekakuan ankle, landing lembut</td></tr><tr><td>Copenhagen short lever</td><td>2×5 per sisi</td><td>Adduktor</td></tr><tr><td>Band pull-apart + external rotation</td><td>2×10</td><td>Skapula &amp; rotator cuff (kiper)</td></tr></tbody></table></div>\n  <h3 class=\"sub\">Pemanasan sepak bola spesifik</h3><ul><li>Skipping, lunge + rotasi, shuffle, carioca</li><li>Landing drill dua kaki → satu kaki: lutut sejajar jari kaki</li><li>Akselerasi &amp; cutting 50% → 80% → 100%</li><li>Selesai ±10–15 menit sebelum kick-off; pemain cadangan re-warm 2–3 menit (pogo, sprint pendek) sebelum masuk</li></ul>"}};

/* ===== helpers ===== */
const ul = a => `<ul>${a.map(x => `<li>${x}</li>`).join("")}</ul>`;
const ol = a => `<ol>${a.map(x => `<li>${x}</li>`).join("")}</ol>`;
const tbl = (h, r) => `<div class="tw"><table><thead><tr>${h.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(x => `<tr>${x.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const box = (c, h, body) => `<div class="box ${c}">${h ? `<b class="h">${h}</b>` : ""}${body}</div>`;
const A = (u, t) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
const PPU = q => "https://www.physio-pedia.com/index.php?search=" + encodeURIComponent(q);
const YTU = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
let SECS = [];
const sec = (id, ic, t, html) => { SECS.push([id, t]); return `<section class="sec" id="s-${id}"><h3><i aria-hidden="true">${ic}</i>${t}</h3>${html}</section>`; };
const flow = steps => `<div class="flow">${steps.map((s,i) => `<div class="fbox ${s.k||""}"><div class="fh"><span class="fn">${i+1}</span><b>${s.t}</b>${s.time ? `<span class="ft">${s.time}</span>` : ""}</div>${s.i ? ul(s.i) : ""}${s.go || ""}</div>`).join("")}</div>`;
const decide = (q, yes, no) => `<div class="decide"><b>${q}</b><div class="dy"><span>Ya</span>${yes}</div><div class="dn"><span>Tidak</span>${no}</div></div>`;
const KCOL = {red:"#D32F2F", amb:"#C77700", grn:"#2E7D32", blu:"#1565C0", nav:"#075BBB", lime:"#5E9E33"};
const chev = items => `<div class="chev">${items.map(([k,t,s]) => `<div style="background:${KCOL[k]}"><b>${t}</b>${s||""}</div>`).join("")}</div>`;
const ladder = items => `<div class="ladder">${items.map(([n,t,k]) => `<div class="rg"><b style="background:${KCOL[k]}">${n}</b><span>${t}</span></div>`).join("")}</div>`;
const testCard = id => { const t = T[id]; if(!t) return ""; return `<div class="test"><b class="t">${esc(t.n)}</b>${t.img && IMG[t.img] ? `<div class="fig"><img loading="lazy" src="${IMG[t.img]}" alt="Ilustrasi ${esc(t.n)}"></div>` : ""}<p style="margin:4px 0"><b>Cara:</b> ${esc(t.how)}</p><div class="pos"><b>Positif:</b> ${esc(t.pos)}</div>${t.q ? `<a class="lnk" href="${PPU(t.q)}" target="_blank" rel="noopener">Physiopedia ↗</a><a class="lnk" href="${YTU(t.q + " test")}" target="_blank" rel="noopener">Video ↗</a>` : t.link ? `<a class="lnk" href="${t.link}" target="_blank" rel="noopener">Sumber ↗</a>` : ""}</div>`; };
const fig = svg => `<div class="fig">${svg}</div>`;
const CHK = (key, items) => { const st = LS.get("ck-" + key, {}); return `<div data-ckey="${key}">${items.map((t,i) => `<label class="ck"><input type="checkbox" data-i="${i}" ${st[i]?"checked":""}><span>${t}</span></label>`).join("")}</div>`; };

function buildIdx(){ IDX = [];

function search(q){
  const res = document.getElementById("res"), cats = document.getElementById("cats"); q = q.trim().toLowerCase();
  if(!q){ res.innerHTML = ""; cats.style.display = ""; return; }

  cats.style.display = "none";
  res.innerHTML = hits.length ? hits.map(h => { const i = h.tx.toLowerCase().indexOf(words[0]); const sn = i >= 0 ? h.tx.slice(Math.max(0, i-50), i+80) : ""; return `<button class="row" data-go="${h.go}"><span class="tx"><b>${esc(h.n)}</b><small>${esc(h.s)}${sn ? " — …" + esc(sn) + "…" : ""}</small></span><span class="ar">›</span></button>`; }).join("") : `<p class="nores">Tidak ditemukan. Coba kata lain, mis. “ankle”, “MRI”, “doping”.</p>`;

function bind(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { const g = b.dataset.go; if(("#" + g) === location.hash || (!g && !location.hash)) route(); else location.hash = g; });
  root.querySelectorAll("[data-jump]").forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById(a.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); });
  root.querySelectorAll("[data-ckey]").forEach(w => w.querySelectorAll("input").forEach(i => i.onchange = () => { const k = "ck-" + w.dataset.ckey, st = LS.get(k, {}); st[i.dataset.i] = i.checked; LS.set(k, st); }));
  root.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => { LS.set("ck-" + b.dataset.reset, {}); route(); });
}
window.addEventListener("hashchange", route);
document.getElementById("homeBtn").onclick = () => { if(location.hash) location.hash = ""; else home(); };
(function(){ const th = LS.get("cs-theme", null); if(th) document.documentElement.setAttribute("data-theme", th);
  document.getElementById("themeBtn").onclick = () => { const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", nx); LS.set("cs-theme", nx); }; })();
route();


document.getElementById("menuBtn").onclick = () => parent.postMessage({hb:"home"}, "*");
document.addEventListener("click", e => { const a = e.target.closest('a[href="EMBED"]'); if(a){ e.preventDefault(); parent.postMessage({hb:"app"}, "*"); } }, true);
window.addEventListener("message", e => { const m = e.data || {}; if(m.hb === "go"){ const id = m.id || ""; const h = LEGACY[id] || id; if(("#" + h) === location.hash || (!h && !location.hash)) route(); else location.hash = h; } });
</script>
</body>
</html>
